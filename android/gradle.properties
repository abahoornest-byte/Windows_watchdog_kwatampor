# android/gradle.properties
org.gradle.jvmargs=-Djava.net.preferIPv4Stack=true
android.useAndroidX=true
android.enableJetifier=true
# Force Gradle to use TLS 1.2, which is widely supported
systemProp.jdk.tls.client.protocols=TLSv1.2
systemProp.https.protocols=TLSv1.2

# Force Java to prefer the IPv4 network stack, which can resolve handshake issues
systemProp.java.net.preferIPv4Stack=true
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000