name: hotspot_watchdog
description: Captive portal watchdog for Sopraent hotspot.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  # Flutter 3.35+ forces minSdk 24 (Android 7.0), which cannot install on
  # Android 5.1.1 (API 22). This upper bound makes `flutter pub get` fail
  # loudly on a too-new Flutter instead of silently producing an APK that
  # the tablet refuses to install. Use Flutter 3.32.x (3.22 – 3.34 all work).
  flutter: '>=3.22.0 <3.35.0'

dependencies:
  flutter:
    sdk: flutter

  crypto: ^3.0.3
  path_provider: ^2.1.4
  tray_manager: ^0.2.3
  window_manager: ^0.4.2
  webview_flutter: ^4.8.0
  webview_flutter_android: ^3.16.8
  android_id: ^0.4.0

  # desktop_webview_window — no longer needed

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true